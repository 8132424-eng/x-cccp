# =====================================================================
# NETLIFY CONFIGURATION
# Deploy settings. Edit only if you change build commands.
# =====================================================================

[build]
  publish = "."          # site root is served as-is (no build step)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

