<body>

<!-- Decorative deep-red stripe (flag reference) -->
<div class="red-stripe"></div>

<!-- ============ HEADER ============ -->
<header>
    <div class="logo">
        <h1><span>X</span>-CCCP</h1>
        <div class="sub">EX-USSR</div>
    </div>
    <!-- Navigation: labels are injected by i18n.js via data-i18n -->
    <nav class="nav-menu" id="navMenu">
        <a href="#home" data-page="home" data-i18n="nav_home" class="active"></a>
        <a href="#resources" data-page="resources" data-i18n="nav_resources"></a>

</header>

<!-- ============ LANGUAGE SWITCHER ============ -->
<!-- Buttons are generated by i18n.js from LANGUAGES array in config.js -->
<div class="lang-bar" id="langBar"></div>

<!-- ============ PAGE: HOME ============ -->
<div id="page-home" class="page active-page">
    <h2 data-i18n="home_title"></h2>
    <p class="lead" data-i18n="home_intro"></p>
    <p class="tagline" data-i18n="home_tagline"></p>

    <div class="card-grid">
        <div class="card">
            <h3>📍 <span data-i18n="card_where_title"></span></h3>
            <p data-i18n="card_where_text"></p>
        </div>
        <div class="card">
            <h3>👤 <span data-i18n="card_who_title"></span></h3>
            <p data-i18n="card_who_text"></p>
        </div>
        <div class="card">
            <h3>🎯 <span data-i18n="card_why_title"></span></h3>
            <p data-i18n="card_why_text"></p>
        </div>
        <div class="card">
            <h3>🛠️ <span data-i18n="card_how_title"></span></h3>
            <p data-i18n="card_how_text"></p>
        </div>

    <p class="disclaimer" data-i18n="disclaimer"></p>

    <!-- CTA: goes to the same page as menu item #3 -->
    <a href="#contact" class="cta-button" data-page="contact" data-i18n="cta_contact"></a>
</div>

<!-- ============ PAGE: RESOURCES (Tietolähde) ============ -->
<!-- [MODIFY] External links: edit href below or move them to config.js -->
<div id="page-resources" class="page">

    <p data-i18n="resources_intro"></p>

    <div class="link-stack">
        <a href="https://mosclub.netlify.app" class="external-link" target="_blank" rel="noopener">
            <span data-i18n="res1"></span>
        </a>
        <a href="https://mosclub.netlify.app" class="external-link" target="_blank" rel="noopener">

        </a>
    </div>

    <p class="muted" data-i18n="resources_footer"></p>
</div>

<!-- ============ PAGE: CONTACT (Viestiyhteydet) ============ -->
<!-- =====================================================================
     [MODIFY] NETLIFY FORM
     - name="contact"  →  must match NETLIFY_FORM_NAME in js/config.js
     - data-netlify="true"  →  tells Netlify to detect this form
     - data-netlify-honeypot="bot-field"  →  enables honeypot
     - hidden input form-name  →  required for Netlify Forms
     Do NOT remove any of these attributes.
     ===================================================================== -->
<div id="page-contact" class="page">
    <h2 data-i18n="contact_title"></h2>
    <p data-i18n="contact_intro"></p>

    <form
        id="contactForm"
        name="contact"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        action="/?success=true#contact"
        class="contact-form"
        novalidate
    >
        <!-- Required hidden input for Netlify Forms -->
        <input type="hidden" name="form-name" value="contact">

        <!-- Honeypot field: hidden from humans, visible to bots -->
        <p class="hp-field" aria-hidden="true">
            <label>Do not fill this out: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
        </p>

        <div class="form-row">
            <label data-i18n="form_name"></label>
            <input type="text" name="name" required autocomplete="name">
        </div>
        <div class="form-row">
            <label data-i18n="form_email"></label>
            <input type="email" name="email" required autocomplete="email">
        </div>
        <div class="form-row">
            <label data-i18n="form_message"></label>
            <textarea name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="cta-button" data-i18n="form_send"></button>
    </form>

    <p id="formStatus" class="form-status" role="status"></p>
</div>

<!-- ============ FOOTER ============ -->
<footer data-i18n="footer_text"></footer>

<!-- Entry point: loads all modules -->
<script type="module" src="js/app.js"></script>

<script>console.log('OK JS is alive');</script>

</body>
</html>
