/* ==========================================================================
   ROOT VARIABLES
   Layout, spacing and typography tokens are unchanged from the dark theme.
   Only the color values have been switched to a light palette.
   ========================================================================== */
:root {
  --bg: #f7f5f3;              /* Main page background (light) */
  --surface: #ffffff;         /* Card / panel background */
  --surface2: #f0edea;        /* Secondary surface (hover states, inputs) */
  --border: #dddddd;          /* Default border color */
  --text: #1e1e1e;            /* Primary text color */
  --muted: #666666;           /* Muted / secondary text color */
  --red: #c1121f;             /* Accent red */
  --red-dim: #8a0e18;         /* Dimmed red for hover states */
  --accent: #8a0e18;          /* Dark red used for taglines */
  --radius: 10px;             /* Standard border radius */
}

/* ==========================================================================
   GLOBAL RESET
   ========================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  padding-top: 4px;           /* Space for the fixed red stripe at the top */
}

/* ==========================================================================
   DECORATIVE RED STRIPE
   ========================================================================== */
.red-stripe {
  height: 4px;
  background: linear-gradient(90deg, var(--red), var(--red-dim), var(--red));
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
}

/* ==========================================================================
   HEADER
   ========================================================================== */
header {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem 0.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.logo h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.logo h1 span { color: var(--red); }

.logo .sub {
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ==========================================================================
   NAVIGATION MENU
   ========================================================================== */
nav {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
}
nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
}
nav a:hover, nav a.active {
  color: var(--text);
  border-bottom-color: var(--red);
}

/* ==========================================================================
   LANGUAGE SWITCHER BAR
   ========================================================================== */
.lang-bar {
  max-width: 900px;
  margin: 0.75rem auto 0;
  padding: 0 1.25rem;
  display: flex;
  gap: 0.5rem;
}
.lang-bar button {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all .2s;
}
.lang-bar button.active {
  background: var(--red-dim);
  color: #ffffff;
  border-color: var(--red);
}

/* ==========================================================================
   MAIN CONTENT AREA
   ========================================================================== */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 4rem;
}

.page { display: none; animation: fade .3s ease; }
.page.active-page { display: block; }

@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

h2 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 700; }
h3 { font-size: 1rem; margin-bottom: 0.4rem; }
p  { margin-bottom: 0.9rem; }
.lead { font-size: 1.05rem; color: #444444; }   /* was #ccc in dark theme */

.tagline {
  font-size: 0.85rem;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

/* ==========================================================================
   CARD GRID (Home page feature cards)
   ========================================================================== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin: 1.5rem 0;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  transition: border-color .2s, transform .15s;
}
.card:hover {
  border-color: var(--red-dim);
  transform: translateY(-2px);
}
.card p { font-size: 0.9rem; color: #444444; margin-bottom: 0; }  /* was #bbb */

.disclaimer {
  font-size: 0.8rem;
  color: var(--muted);
  border-left: 3px solid var(--red-dim);
  padding-left: 1rem;
  margin: 1.5rem 0;
  font-style: italic;
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.cta-button {
  display: inline-block;
  background: var(--red);
  color: #ffffff;
  text-decoration: none;
  padding: 0.7rem 1.6rem;
  border-radius: 24px;
  font-weight: 600;
  font-size: 0.9rem;
  border: none;
  cursor: pointer;
  transition: background .2s, transform .15s;
}
.cta-button:hover { background: var(--red-dim); transform: translateY(-1px); }

/* ==========================================================================
   RESOURCE LINKS (Resources page)
   ========================================================================== */
.link-stack { display: flex; flex-direction: column; gap: 0.75rem; margin: 1.25rem 0; }
.external-link {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1.25rem;
  color: var(--text);
  text-decoration: none;
  font-size: 0.95rem;
  transition: border-color .2s, background .2s;
}
.external-link:hover { border-color: var(--red); background: var(--surface2); }
.muted { font-size: 0.8rem; color: var(--muted); }

/* ==========================================================================
   CONTACT FORM
   ========================================================================== */
.contact-form { max-width: 480px; margin-top: 1.5rem; }
.form-row { margin-bottom: 1rem; }
.form-row label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.35rem;
}
.form-row input, .form-row textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.65rem 0.85rem;
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
  transition: border-color .2s;
}
.form-row input:focus, .form-row textarea:focus {
  outline: none;
  border-color: var(--red);
}
.form-row textarea { resize: vertical; min-height: 110px; }

.field-note {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 0.3rem;
  font-style: italic;
}

.form-msg { font-size: 0.9rem; margin-top: 0.75rem; }

/* ==========================================================================
   HONEYPOT FIELD
   ========================================================================== */
.hp-field {
  position: absolute;
  left: -9999px;
  top: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */
footer {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}

/* ==========================================================================
   RESPONSIVE OVERRIDES (mobile)
   ========================================================================== */
@media (max-width: 600px) {
  header { flex-direction: column; align-items: flex-start; }
  nav { gap: 0.85rem; }
  .card-grid { grid-template-columns: 1fr; }
}
</style>

/* ==========================================================================
   LANGUAGE ORDER
   Finnish is the project's primary language.
   ========================================================================== */
const LANG_ORDER = ["fi", "sv", "en", "es", "zh"];
const LANG_LABELS = {
  fi: "FI",
  sv: "SV",
  en: "EN",
  es: "ES",
  zh: "中文"
};

/* ==========================================================================
   CURRENT LANGUAGE STATE
   ========================================================================== */
let currentLang = localStorage.getItem("xcccp-lang") || "fi";

/* ==========================================================================
   APPLY LANGUAGE
   ========================================================================== */
function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem("xcccp-lang", lang);

  const dict = content[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) {
      el.textContent = dict[key];
    }
  });

  document.querySelectorAll(".lang-bar button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });

  document.documentElement.lang = lang;
}

/* ==========================================================================
   NAVIGATION
   ========================================================================== */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
  const target = document.getElementById("page-" + id);
  if (target) target.classList.add("active-page");

  document.querySelectorAll("nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.page === id);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ==========================================================================
   CONTACT FORM HANDLER
   Client-side validation + honeypot checks.
   ========================================================================== */
function handleForm(e) {
  e.preventDefault();
  const form = e.target;
  const msg = document.getElementById("formMsg");

  /* Honeypot #1: hidden "website" field must remain empty */
  if (form.website.value.trim() !== "") {
    msg.textContent = content[currentLang].form_ok;
    msg.style.color = "#2e7d32";          /* success color for the light theme */
    form.reset();
    return;
  }

  /* Honeypot #2: reject submissions faster than 2 seconds */
  const renderedAt = parseInt(form.form_ts.value || "0", 10);
  const elapsed = Date.now() - renderedAt;
  if (renderedAt && elapsed < 2000) {
    msg.textContent = content[currentLang].form_ok;
    msg.style.color = "#2e7d32";
    form.reset();
    return;
  }

  /* Standard required-field validation */
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const message = form.message.value.trim();

  if (!name || !email || !message) {
    msg.textContent = content[currentLang].form_error;
    msg.style.color = "#c1121f";          /* error color for the light theme */
    return;
  }

  msg.textContent = content[currentLang].form_ok;
  msg.style.color = "#2e7d32";
  form.reset();
  form.form_ts.value = Date.now();
}

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
document.addEventListener("DOMContentLoaded", () => {

  const bar = document.getElementById("langBar");
  LANG_ORDER.forEach(lang => {
    const btn = document.createElement("button");
    btn.textContent = LANG_LABELS[lang];
    btn.dataset.lang = lang;
    btn.addEventListener("click", () => applyLang(lang));
    bar.appendChild(btn);
  });

  document.querySelectorAll("nav a, [data-page]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showPage(el.dataset.page);
    });
  });

  const form = document.getElementById("contactForm");
  form.addEventListener("submit", handleForm);

  document.getElementById("formTs").value = Date.now();

  applyLang(currentLang);
});
</script>
